title: "[General] "
body:
  - type: markdown
    attributes:
      value: |
        ### Community chat
        Use this category for general conversation about UltimateDonutSMP V2 — setup tips, server ideas, or feedback that does not fit elsewhere.

        **Need a faster answer?** Join [Discord](https://dsc.gg/hellstarr).  
        **Found a bug or want a tracked feature?** Open an [issue](https://github.com/BeestoXd/UltimateDonutSMP-V2/issues/new/choose) instead.

  - type: textarea
    id: topic
    attributes:
      label: What would you like to talk about?
      description: A short summary so others know what your thread is about.
      placeholder: "e.g. Best practices for configuring economy on a new season..."
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Share context, questions, or anything else you want the community to respond to.
    validations:
      required: false
