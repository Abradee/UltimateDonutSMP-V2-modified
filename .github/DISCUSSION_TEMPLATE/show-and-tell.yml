title: "[Show and tell] "
body:
  - type: markdown
    attributes:
      value: |
        ### Show what you've built
        Share your server setup, custom configs, integrations, or anything cool you made with UltimateDonutSMP V2.

  - type: input
    id: title_hint
    attributes:
      label: Short title
      description: What should people call your project or setup?
      placeholder: "Season 3 economy-focused SMP"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What did you build, and how does UltimateDonutSMP V2 fit in?
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Links (optional)
      description: Screenshots, Discord, Planet Minecraft, videos, etc.
      placeholder: |
        - https://...
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Sharing
      options:
        - label: I am okay with maintainers referencing this thread in release notes or docs (with credit).
          required: false
